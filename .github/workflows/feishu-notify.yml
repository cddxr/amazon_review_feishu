name: Feishu New Review Notify
# minor non-functional note for local sync

on:
  workflow_run:
    workflows: ["Review Sync Scheduler"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Fetch rating/review snapshot
        run: |
          python amazon_rating_only_selenium.py > rating.json || echo "{\"items\": []}" > rating.json

      - name: Fetch new-review summary
        run: |
          curl -sS "https://amazon-review-feishu.onrender.com/reviews/sync/runs/new?hours=12&limit=200&include_content=true&sample_size=2" -o summary.json

      - name: Build Feishu card payload
        run: |
          python - << 'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta

          BASE_URL = "https://amazon-review-feishu.onrender.com"
          NAME_TO_ASIN = {
              "VP218": "B0F8HXNY5N",
              # "XG001": "B0FQCBMFYQ",
              "B0FRSHR4CP": "B0FRSHR4CP",
          }

          with open("rating.json", "r", encoding="utf-8") as f:
              rating_data = json.load(f)
          with open("summary.json", "r", encoding="utf-8") as f:
              summary_data = json.load(f)

          by_asin_rating = {item.get("asin"): item for item in rating_data.get("items", [])}
          by_asin_new = {item.get("asin"): item for item in summary_data.get("asins_with_new_reviews", [])}

          # China local date (no +1 day)
          payload_date = (datetime.utcnow() + timedelta(hours=8)).strftime("%Y-%m-%d")

          def normalize_count(text):
              if not text:
                  return None
              m = re.search(r"([\d,]+)", str(text))
              if not m:
                  return None
              try:
                  return int(m.group(1).replace(",", ""))
              except Exception:
                  return None

          def normalize_review_score(value):
              if value is None:
                  return None
              if isinstance(value, (int, float)):
                  score = float(value)
              else:
                  m = re.search(r"(\d+(?:\.\d+)?)", str(value))
                  if not m:
                      return None
                  try:
                      score = float(m.group(1))
                  except Exception:
                      return None
              if score < 0:
                  score = 0.0
              if score > 5:
                  score = 5.0
              return score

          def render_review_score(value):
              score = normalize_review_score(value)
              if score is None:
                  return ""
              full_stars = max(0, min(5, int(round(score))))
              star_text = ("?" * full_stars) + ("?" * (5 - full_stars))
              score_text = str(int(score)) if score.is_integer() else f"{score:.1f}"
              return f"{star_text} ({score_text}/5)"

          def fetch_latest_review_total(asin):
              try:
                  query = urllib.parse.urlencode({"asin": asin})
                  url = f"{BASE_URL}/reviews/sync/state?{query}"
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  value = payload.get("last_total_reviews")
                  if value is None:
                      return None
                  return int(value)
              except Exception:
                  return None

          items = []
          for name, asin in NAME_TO_ASIN.items():
              rating_item = by_asin_rating.get(asin, {})
              new_item = by_asin_new.get(asin, {})

              rating_value = rating_item.get("rating_value", "N/A")
              rating_count = normalize_count(rating_item.get("reviews_raw", ""))

              review_total = fetch_latest_review_total(asin)
              if review_total is None:
                  try:
                      review_total = int(new_item.get("current_total"))
                  except Exception:
                      review_total = None

              new_count = int(new_item.get("new_count", 0) or 0)

              sample = (new_item.get("new_reviews_sample", []) or [])
              reviews = []
              for review in sample:
                  title = (review.get("title") or "").strip()
                  content_en = (review.get("text") or "").strip()
                  title_zh = (review.get("title_zh") or "").strip()
                  content_zh = (review.get("text_zh") or "").strip()
                  summary = (review.get("summary_zh") or "").strip()
                  review_score = render_review_score(review.get("rating"))

                  tags = review.get("tags")
                  if isinstance(tags, list):
                      tag_text = ",".join([str(x).strip() for x in tags if str(x).strip()])
                  else:
                      tag_text = ""

                  reviews.append({
                      "title": title,
                      "content": content_en,
                      "title_zh": title_zh,
                      "content_zh": content_zh,
                      "summary": summary,
                      "review_score": review_score,
                      "tag": tag_text,
                  })

              items.append({
                  "time": payload_date,
                  "asin": asin,
                  "name": name,
                  "rating_value": rating_value,
                  "rating_count": rating_count,
                  "total": review_total,
                  "new_count": new_count,
                  "reviews": reviews,
              })

          lines = []
          for idx, item in enumerate(items, start=1):
              asin = item.get("asin") or ""
              if asin == "B0F8HXNY5N":
                  label = "VP218 ????.B0F8HXNY5N"
              elif asin == "B0FQCBMFYQ":
                  label = "XG001 ?????.B0FQCBMFYQ"
              else:
                  label = asin

              lines.append(f"**{idx}.{label}**")
              lines.append(f"**rating:** {item.get('rating_value')}/{item.get('rating_count') or ''}")
              lines.append(f"**??:** {item.get('total') or ''}")
              lines.append(f"**??:** {item.get('new_count') or 0}")
              lines.append("")

              reviews = item.get("reviews") or []
              if reviews:
                  for r_idx, review in enumerate(reviews, start=1):
                      lines.append(f"**??{r_idx}:**")
                      if review.get("title"):
                          lines.append(f"**??:** {review.get('title')}")
                      if review.get("content"):
                          lines.append(f"**??:** {review.get('content')}")
                      if review.get("title_zh"):
                          lines.append(f"**??:** {review.get('title_zh')}")
                      if review.get("content_zh"):
                          lines.append(f"**??:** {review.get('content_zh')}")
                      if review.get("summary"):
                          lines.append(f"**summary:** {review.get('summary')}")
                      if review.get("review_score"):
                          lines.append(f"**????:** {review.get('review_score')}")
                      if review.get("tag"):
                          lines.append(f"**tag:** {review.get('tag')}")
                      lines.append("")
              lines.append("")

              if idx < len(items):
                  lines.append("????????????????????????????????")
                  lines.append("")

          body_text = "\n".join(lines).strip()

          payload = {
              "msg_type": "interactive",
              "card": {
                  "config": {
                      "wide_screen_mode": True
                  },
                  "header": {
                      "template": "blue",
                      "title": {
                          "tag": "plain_text",
                          "content": f"{payload_date} Review Delta Daily"
                      }
                  },
                  "elements": [
                      {
                          "tag": "markdown",
                          "content": body_text
                      }
                  ]
              }
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Send to Feishu webhook
        run: |
          WEBHOOK_URL="https://open.feishu.cn/open-apis/bot/v2/hook/b2b81928-7d95-486e-9e39-a6bc6f58a456"
          resp=$(curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          echo "$resp"
