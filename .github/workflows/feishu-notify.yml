name: Feishu New Review Notify

on:
  workflow_run:
    workflows: ["Review Sync Scheduler"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Fetch rating/review snapshot
        run: |
          python amazon_rating_only_selenium.py > rating.json || echo "{\"items\": []}" > rating.json

      - name: Fetch new-review summary
        run: |
          curl -sS "https://amazon-review-feishu.onrender.com/reviews/sync/runs/new?hours=12&limit=200&include_content=true&sample_size=2" -o summary.json

      - name: Build Structured payload
        run: |
          python - << 'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta

          BASE_URL = "https://amazon-review-feishu.onrender.com"
          NAME_TO_ASIN = {
              "VP218": "B0F8HXNY5N",
              "XG001": "B0FQCBMFYQ",
          }

          with open("rating.json", "r", encoding="utf-8") as f:
              rating_data = json.load(f)
          with open("summary.json", "r", encoding="utf-8") as f:
              summary_data = json.load(f)

          by_asin_rating = {item.get("asin"): item for item in rating_data.get("items", [])}
          by_asin_new = {item.get("asin"): item for item in summary_data.get("asins_with_new_reviews", [])}

          payload_date = (datetime.utcnow() + timedelta(hours=8, days=1)).strftime("%Y-%m-%d")

          def normalize_count(text):
              if not text:
                  return None
              m = re.search(r"([\d,]+)", str(text))
              if not m:
                  return None
              try:
                  return int(m.group(1).replace(",", ""))
              except Exception:
                  return None

          def fetch_latest_review_total(asin):
              try:
                  query = urllib.parse.urlencode({"asin": asin})
                  url = f"{BASE_URL}/reviews/sync/state?{query}"
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  value = payload.get("last_total_reviews")
                  if value is None:
                      return None
                  return int(value)
              except Exception:
                  return None

          items = []
          for name, asin in NAME_TO_ASIN.items():
              rating_item = by_asin_rating.get(asin, {})
              new_item = by_asin_new.get(asin, {})

              rating_count = normalize_count(rating_item.get("reviews_raw", ""))
              review_total = fetch_latest_review_total(asin)
              if review_total is None:
                  try:
                      review_total = int(new_item.get("current_total"))
                  except Exception:
                      review_total = None

              new_count = int(new_item.get("new_count", 0) or 0)

              sample = (new_item.get("new_reviews_sample", []) or [])
              first = sample[0] if sample else {}

              content_en = (first.get("text") or "").strip()
              content_zh = (first.get("text_zh") or "").strip()
              summary = (first.get("summary_zh") or "").strip()
              tags = first.get("tags")
              if isinstance(tags, list):
                  tag_text = ",".join([str(x).strip() for x in tags if str(x).strip()])
              else:
                  tag_text = ""

              title = (first.get("title") or "").strip()
              title_zh = (first.get("title_zh") or "").strip()

              items.append({
                  "time": payload_date,
                  "asin": asin,
                  "name": name,
                  "total": review_total,
                  "new_count": new_count,
                  "title": title,
                  "content": content_en,
                  "title_zh": title_zh,
                  "content_zh": content_zh,
                  "summary": summary,
                  "tag": tag_text,
              })

          # Prebuilt message text so Feishu automation can directly send without template logic.
          lines = [f"{payload_date} Review Delta Daily", ""]
          for idx, item in enumerate(items, start=1):
              asin = item.get("asin") or ""
              if asin == "B0F8HXNY5N":
                  label = "VP218 蘑菇可可.B0F8HXNY5N"
              elif asin == "B0FQCBMFYQ":
                  label = "XG001 蛋白质咖啡.B0FQCBMFYQ"
              else:
                  label = asin

              lines.append(f"{idx}.{label}")
              lines.append(f"time: {item.get('time') or ''}")
              lines.append(f"total: {item.get('total') or ''}")
              lines.append(f"new_count: {item.get('new_count') or 0}")
              lines.append("")

              if item.get("title"):
                  lines.append(f"title: {item.get('title')}")
              if item.get("content"):
                  lines.append(f"content: {item.get('content')}")
              if item.get("title_zh"):
                  lines.append(f"title_zh: {item.get('title_zh')}")
              if item.get("content_zh"):
                  lines.append(f"content_zh: {item.get('content_zh')}")
              if item.get("summary"):
                  lines.append(f"summary: {item.get('summary')}")
              if item.get("tag"):
                  lines.append(f"tag: {item.get('tag')}")
              lines.append("")

              if idx < len(items):
                  lines.append("────────────────────────────────")
                  lines.append("")

          payload = {
              "title": f"{payload_date} Review Delta Daily",
              "content": "\n".join(lines).strip(),
              "date": payload_date,
              "items": items,
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Send to Feishu webhook
        run: |
          WEBHOOK_URL="https://open.feishu.cn/open-apis/bot/v2/hook/b2b81928-7d95-486e-9e39-a6bc6f58a456"
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload.json
