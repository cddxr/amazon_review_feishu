name: Feishu New Review Notify

on:
  workflow_run:
    workflows: ["Review Sync Scheduler"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Fetch rating/review snapshot
        run: |
          python amazon_rating_only_selenium.py > rating.json || echo "{\"items\": []}" > rating.json

      - name: Fetch new-review summary
        run: |
          curl -sS "https://amazon-review-feishu.onrender.com/reviews/sync/runs/new?hours=12&limit=200&include_content=true&sample_size=2" -o summary.json

      - name: Build Structured payload
        run: |
          python - << 'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta

          BASE_URL = "https://amazon-review-feishu.onrender.com"
          NAME_TO_ASIN = {
              "VP218": "B0F8HXNY5N",
              "XG001": "B0FQCBMFYQ",
          }

          with open("rating.json", "r", encoding="utf-8") as f:
              rating_data = json.load(f)
          with open("summary.json", "r", encoding="utf-8") as f:
              summary_data = json.load(f)

          by_asin_rating = {item.get("asin"): item for item in rating_data.get("items", [])}
          by_asin_new = {item.get("asin"): item for item in summary_data.get("asins_with_new_reviews", [])}

          payload_date = (datetime.utcnow() + timedelta(hours=8, days=1)).strftime("%Y-%m-%d")

          def normalize_count(text):
              if not text:
                  return None
              m = re.search(r"([\d,]+)", str(text))
              if not m:
                  return None
              try:
                  return int(m.group(1).replace(",", ""))
              except Exception:
                  return None

          def normalize_suggestions(value):
              if isinstance(value, list):
                  items = [str(x).strip() for x in value if str(x).strip()]
                  return items[:1]
              return []

          def normalize_star_value(value):
              try:
                  num = float(value)
              except (TypeError, ValueError):
                  return None
              if num < 0:
                  num = 0
              if num > 5:
                  num = 5
              return int(round(num))

          def render_stars(value):
              n = normalize_star_value(value)
              if n is None:
                  return "N/A"
              return f"{'鈽? * n}{'鈽? * (5 - n)} ({n}/5)"

          def fetch_latest_review_total(asin):
              try:
                  query = urllib.parse.urlencode({"asin": asin})
                  url = f"{BASE_URL}/reviews/sync/state?{query}"
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  value = payload.get("last_total_reviews")
                  if value is None:
                      return None
                  return int(value)
              except Exception:
                  return None

          items = []
          for name, asin in NAME_TO_ASIN.items():
              rating_item = by_asin_rating.get(asin, {})
              new_item = by_asin_new.get(asin, {})

              rating_value_raw = rating_item.get("rating_value")
              try:
                  rating_value = float(rating_value_raw)
              except Exception:
                  rating_value = None

              rating_count = normalize_count(rating_item.get("reviews_raw", ""))
              review_total = fetch_latest_review_total(asin)
              if review_total is None:
                  try:
                      review_total = int(new_item.get("current_total"))
                  except Exception:
                      review_total = None

              new_reviews = []
              for s in (new_item.get("new_reviews_sample", []) or []):
                  zh = (s.get("text_zh") or "").strip()
                  en = (s.get("text") or "").strip()
                  summary = (s.get("summary_zh") or "").strip()

                  raw_tags = s.get("tags")
                  if isinstance(raw_tags, list):
                      tags = [str(x).strip() for x in raw_tags if str(x).strip()]
                  else:
                      tags = []

                  suggestions = normalize_suggestions(s.get("action_suggestions"))
                  suggestion = suggestions[0] if suggestions else ""

                  star_value = normalize_star_value(s.get("rating"))
                  star_text = render_stars(s.get("rating"))

                  new_reviews.append({
                      "zh": zh,
                      "en": en,
                      "star": {
                          "text": star_text,
                          "value": star_value,
                      },
                      "summary": summary,
                      "tags": tags,
                      "suggestion": suggestion,
                  })

              items.append({
                  "name": name,
                  "asin": asin,
                  "rating": {
                      "value": rating_value,
                      "count": rating_count,
                  },
                  "review_total": review_total,
                  "new_reviews": new_reviews,
              })

          payload = {
              "date": payload_date,
              "items": items,
          }

          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Send to Feishu Base webhook
        env:
          FEISHU_BASE_WEBHOOK: ${{ secrets.FEISHU_BASE_WEBHOOK }}
        run: |
          WEBHOOK_URL="${FEISHU_BASE_WEBHOOK:-https://o9xilj84js.feishu.cn/base/workflow/webhook/event/O5ohaBNzbweJCKhiO1McT4I3nTh}"
          curl -sS -X POST "$WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d @payload.json
