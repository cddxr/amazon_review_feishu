name: Feishu New Review Notify

on:
  workflow_run:
    workflows: ["Review Sync Scheduler"]
    types: [completed]
  workflow_dispatch: {}

jobs:
  notify:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install selenium
        run: |
          python -m pip install --upgrade pip
          pip install selenium

      - name: Fetch rating/review snapshot
        run: |
          python amazon_rating_only_selenium.py > rating.json || echo "{\"items\": []}" > rating.json

      - name: Fetch new-review summary
        run: |
          curl -sS "https://amazon-review-feishu-fb07.onrender.com/reviews/sync/runs/new?hours=12&limit=200&include_content=true&sample_size=2" -o summary.json

      - name: Build Feishu payload
        run: |
          python - << 'PY'
          import json
          import re
          import urllib.parse
          import urllib.request
          from datetime import datetime

          BASE_URL = "https://amazon-review-feishu-fb07.onrender.com"
          NAME_TO_ASIN = {
              "VP218": "B0F8HXNY5N",
              "XG001": "B0G64PSMX4",
          }

          with open("rating.json", "r", encoding="utf-8") as f:
              rating_data = json.load(f)
          with open("summary.json", "r", encoding="utf-8") as f:
              summary_data = json.load(f)

          by_asin_rating = {item.get("asin"): item for item in rating_data.get("items", [])}
          by_asin_new = {item.get("asin"): item for item in summary_data.get("asins_with_new_reviews", [])}

          title = f"{datetime.now().strftime('%Y-%m-%d')} Review Delta Daily"
          lines = []
          idx = 0

          def normalize_count(text):
              if not text:
                  return "N/A"
              m = re.search(r"([\d,]+)", str(text))
              if not m:
                  return "N/A"
              return m.group(1).replace(",", "")

          def normalize_tags(value):
              if isinstance(value, list):
                  tags = [str(x).strip() for x in value if str(x).strip()]
                  return ", ".join(tags) if tags else "无"
              if isinstance(value, str) and value.strip():
                  return value.strip()
              return "无"

          def normalize_suggestions(value):
              if isinstance(value, list):
                  items = [str(x).strip() for x in value if str(x).strip()]
                  return items[:1]
              return []

          def normalize_star_value(value):
              try:
                  num = float(value)
              except (TypeError, ValueError):
                  return None
              if num < 0:
                  num = 0
              if num > 5:
                  num = 5
              return int(round(num))

          def render_stars(value):
              n = normalize_star_value(value)
              if n is None:
                  return "N/A"
              return f"{'★' * n}{'☆' * (5 - n)} ({n}/5)"

          def fetch_latest_review_total(asin):
              try:
                  query = urllib.parse.urlencode({"asin": asin})
                  url = f"{BASE_URL}/reviews/sync/state?{query}"
                  with urllib.request.urlopen(url, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
                  value = payload.get("last_total_reviews")
                  return value if value is not None else "N/A"
              except Exception:
                  return "N/A"

          for name, asin in NAME_TO_ASIN.items():
              idx += 1
              rating_item = by_asin_rating.get(asin, {})
              new_item = by_asin_new.get(asin, {})

              rating_value = rating_item.get("rating_value", "N/A")
              rating_count = normalize_count(rating_item.get("reviews_raw", "N/A"))
              review_count = fetch_latest_review_total(asin)
              if review_count == "N/A":
                  review_count = new_item.get("current_total", "N/A")
              new_count = int(new_item.get("new_count", 0) or 0)

              lines.append(f"{idx}.{name}: {asin}")
              lines.append(f"rating: {rating_value}/{rating_count}")
              lines.append(f"review: {review_count}")

              if new_count > 0:
                  samples = new_item.get("new_reviews_sample", [])
                  if samples:
                      lines.append("new_content:")
                      for s in samples:
                          zh = (s.get("text_zh") or "").strip()
                          en = (s.get("text") or "").strip()
                          star_line = render_stars(s.get("rating"))
                          summary = (s.get("summary_zh") or "").strip() or "无"
                          tags = normalize_tags(s.get("tags"))
                          suggestions = normalize_suggestions(s.get("action_suggestions"))
                          if zh:
                              lines.append(f"zh: {zh[:200]}")
                          if en:
                              lines.append(f"en: {en[:200]}")
                          lines.append(f"star: {star_line}")
                          lines.append(f"summary: {summary[:120]}")
                          lines.append(f"tags: {tags}")
                          lines.append("action_suggestions:")
                          if suggestions:
                              for i, item in enumerate(suggestions, start=1):
                                  lines.append(f"{i}) {item[:120]}")
                          else:
                              lines.append("1) 无")
                          lines.append("")
              lines.append("")

          summary = "\n".join(lines).strip()
          payload = {"title": title, "summary": summary}
          with open("payload.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, ensure_ascii=False)
          PY

      - name: Send to Feishu webhook
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          if [ -z "$FEISHU_WEBHOOK" ]; then
            echo "Missing GitHub secret: FEISHU_WEBHOOK"
            exit 1
          fi
          curl -sS -X POST "$FEISHU_WEBHOOK" \
            -H "Content-Type: application/json" \
            -d @payload.json
