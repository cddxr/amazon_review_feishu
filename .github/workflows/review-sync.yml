name: Review Sync Scheduler

on:
  schedule:
    # Daily at 08:00 Asia/Shanghai (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        asin:
          - B0F8HXNY5N # VP218
          - B0G64PSMX4 # XG001
    steps:
      - name: Trigger async sync and wait completion
        run: |
          python - << 'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          base = "https://amazon-review-feishu-fb07.onrender.com"
          asin = "${{ matrix.asin }}"
          query = urllib.parse.urlencode({
              "asin": asin,
              "mode": "max",
              "translate_mode": "full",
          })
          trigger_url = f"{base}/reviews/sync/async?{query}"

          req = urllib.request.Request(trigger_url, method="POST")
          with urllib.request.urlopen(req, timeout=120) as resp:
              payload = json.loads(resp.read().decode("utf-8"))
          task_id = payload["task_id"]
          print(f"[{asin}] task_id={task_id}")

          # Wait until done. Poll every 20s, up to 90 minutes.
          max_rounds = 270
          for i in range(max_rounds):
              check_url = f"{base}/reviews/sync/tasks/{task_id}"
              with urllib.request.urlopen(check_url, timeout=60) as resp:
                  task = json.loads(resp.read().decode("utf-8"))
              status = task.get("status")
              print(f"[{asin}] poll={i+1} status={status}")
              if status == "success":
                  result = task.get("result") or {}
                  print(
                      f"[{asin}] done current_total={result.get('current_total')} "
                      f"new_count={result.get('new_count')}"
                  )
                  break
              if status == "failed":
                  raise RuntimeError(f"[{asin}] async task failed: {task.get('error')}")
              time.sleep(20)
          else:
              raise TimeoutError(f"[{asin}] async task timed out")
          PY
