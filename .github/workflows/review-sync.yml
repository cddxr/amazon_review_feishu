name: Review Sync Scheduler

on:
  schedule:
    # Daily at 08:00 Asia/Shanghai (00:00 UTC)
    - cron: "0 0 * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asin:
          - B0DDCJFFBM # VP203
          - B0DFBMVX7T # VP204
          - B0F8HXNY5N # VP218
          - B0G64PSMX4 # XG001
    steps:
      - name: Trigger async sync
        run: |
          curl -X POST --fail --show-error --silent \
          "https://amazon-review-feishu-fb07.onrender.com/reviews/sync/async?asin=${{ matrix.asin }}&mode=max&translate_mode=full"
